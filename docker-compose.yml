version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smgames
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - WS_PORT=${WS_PORT:-3001}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${WS_PORT:-3001}:${WS_PORT:-3001}"
    restart: unless-stopped
